[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibliominer-analysis"
# The version lives in `__init__.py` and NOWHERE else: two copies always end
# up diverging, and the module's copy is the one users read
# (`bibliominer_analysis.__version__`).
dynamic = ["version"]
description = "Bibliometric analysis of a Scopus corpus cleaned with Bibliominer."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
# Same authors, same order as CITATION.cff and the project's website: the
# order of authorship is meaningful, and every copy must keep it.
authors = [
    { name = "Mohamed Hosni", email = "m.hosni@umi.ac.ma" },
    { name = "Jaouad Zerhouni", email = "j.zerhouni@edu.umi.ac.ma" },
    { name = "Ibtissam Medarhri", email = "medarhri@enim.ac.ma" },
    { name = "Rachid Menaoui", email = "r.menaoui@umi.ac.ma" },
    { name = "Juan Manuel Carrillo de Gea", email = "jmcdg1@um.es" },
]
keywords = [
    "bibliometrics", "scientometrics", "scopus", "co-citation",
    "co-word", "bibliographic-coupling", "science-mapping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    # pandas 1.5, 2 AND 3. The move to pandas 3 was checked by comparing the
    # results on real corpora, not only the tests: `astype(str)` leaves a
    # missing value missing there (hence `map(str)` everywhere) and orders
    # ties differently (hence stable, tie-broken sorts).
    # < 4: a future major version will be checked the same way.
    "pandas>=1.5,<4",
    "numpy>=1.21",
    # Networks (co-citation, co-word, coupling) and community detection for
    # the thematic map are at the heart of bibliometrics: networkx is a
    # dependency, not an option. Pure Python, nothing to compile.
    "networkx>=3.0",
    # EXPORTED figures (`figures/render.py`) are generated by matplotlib,
    # never captured from a browser rendering: that is what makes a published
    # figure reproducible from the same data. Moved from an OPTIONAL to a
    # required dependency: it is no longer a side feature.
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyarrow>=12.0",
]

[project.urls]
Homepage = "https://github.com/Jaouad-Zerhouni/bibliominer-analysis"
Source = "https://github.com/Jaouad-Zerhouni/bibliominer-analysis"
Issues = "https://github.com/Jaouad-Zerhouni/bibliominer-analysis/issues"

[tool.hatch.version]
path = "src/bibliominer_analysis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliominer_analysis"]
# `py.typed` tells the users' type checkers that this package's annotations
# can be trusted (PEP 561). Without this marker, mypy and the like IGNORE
# them: the package is fully annotated, and nobody would benefit.
artifacts = ["src/bibliominer_analysis/py.typed"]

[tool.hatch.build.targets.sdist]
# The source archive is for rebuilding the package and running its tests:
# the repository's CI has no business in it.
exclude = [".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
