# The package, installed as a user would, on the three operating systems.
#
# The wheel is built, INSTALLED, then the tests run from a folder outside
# the repository: it is the installed package that is tested, never the
# source code lying next to it. A data file forgotten in the wheel, a
# Windows-only path or a file name with the wrong case on Linux cannot slip
# through.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 installs pandas 2; 3.12 and later, pandas 3.
        python: ["3.9", "3.12", "3.13", "3.14"]
        pandas: [""]
        include:
          # pandas 2 on a recent Python: both pandas versions must stay
          # covered, not only the latest one.
          - os: ubuntu-latest
            python: "3.13"
            pandas: "pandas<3"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .

      - name: Install the wheel, not the source tree
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest pyarrow ${{ matrix.pandas && format('"{0}"', matrix.pandas) || '' }}
          python -c "import pandas; print('pandas', pandas.__version__)"

      - name: Test the installed package
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/analysis_tests"
          cd "$RUNNER_TEMP"
          python -c "import bibliominer_analysis"
          python -m pytest -q -p no:cacheprovider --import-mode=importlib analysis_tests
